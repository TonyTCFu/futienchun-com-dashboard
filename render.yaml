services:
  - type: web
    name: futienchun-com-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/serve_dashboard.py --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DASHBOARD_TIMEZONE
        value: Asia/Shanghai
      - key: DASHBOARD_REBUILD_TIME
        value: "13:45"
      - key: DASHBOARD_REBUILD_COMMAND
        value: python src/risk_dashboard.py --start 2024-01 --offline-cache --allow-stale-cache --model-portfolio --model-build-date 2026-06-03 --model-invest-ratio 0.75 --model-method multi-factor-shrink --ai-tilt moderate --market-source public-close --market-mode close --execute-simulated-trades
